name: Scheduled Build

on:
  schedule:
    - cron: '0 4 * * 0'   # Weekly — Sunday 4 AM UTC
    - cron: '0 4 1 * *'   # Additional monthly run — 1st of month 4 AM UTC
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/python-base

permissions:
  contents: read
  packages: write

concurrency:
  group: scheduled-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      push_minor: ${{ steps.matrix.outputs.push_minor }}
      push_version: ${{ steps.matrix.outputs.push_version }}
    steps:
      - name: Determine platforms
        id: platforms
        run: |
          set -euo pipefail
          # Shared release tags must always stay multi-arch.
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          echo "Building for: $(cat "$GITHUB_OUTPUT" | grep platforms | cut -d= -f2)"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect latest CPython versions and build matrix
        id: matrix
        run: |
          set -euo pipefail

          FTP_INDEX=$(curl -sL https://www.python.org/ftp/python/)
          PUSH_MINOR="3.14"
          echo "push_minor=" >> "$GITHUB_OUTPUT"
          echo "push_version=" >> "$GITHUB_OUTPUT"

          build_matrix='{"include":['
          first=true

          for MINOR in 3.12 3.13 3.14; do
            if [[ "${{ github.event_name }}" == "push" && "$MINOR" != "$PUSH_MINOR" ]]; then
              echo "Push run prioritizes ${PUSH_MINOR}; skipping ${MINOR}"
              continue
            fi

            LATEST=$(echo "$FTP_INDEX" \
              | grep -oP "${MINOR//./\\.}\.\d+" \
              | sort -t. -k3 -n \
              | tail -1)

            if [[ -z "$LATEST" ]]; then
              echo "WARNING: No release found for ${MINOR}.x — skipping"
              continue
            fi

            # Check if already published (skip if so, unless manual/push)
            SKIP="false"
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              if MANIFEST_JSON=$(docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${LATEST}" 2>/dev/null); then
                if echo "$MANIFEST_JSON" | jq -e '
                  any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
                  any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
                ' > /dev/null; then
                  echo "Version ${LATEST} already published for amd64 and arm64 — skipping"
                  SKIP="true"
                else
                  echo "Version ${LATEST} is missing one or more target platforms — rebuilding"
                fi
              fi
            fi

            if [[ "$SKIP" == "false" ]]; then
              [[ "$first" == "true" ]] && first=false || build_matrix+=','
              build_matrix+="{\"minor\":\"${MINOR}\",\"version\":\"${LATEST}\"}"
            fi
          done

          build_matrix+=']}'

          # Check if matrix is empty
          COUNT=$(echo "$build_matrix" | jq '.include | length')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No versions to build"
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "push_minor=$(echo "$build_matrix" | jq -r '.include[0].minor')" >> "$GITHUB_OUTPUT"
              echo "push_version=$(echo "$build_matrix" | jq -r '.include[0].version')" >> "$GITHUB_OUTPUT"
            fi
            echo "matrix=${build_matrix}" >> "$GITHUB_OUTPUT"
            echo "Building: ${build_matrix}"
          fi

  build:
    needs: detect
    if: github.event_name != 'push' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: contains(needs.detect.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          set -euo pipefail
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.minor }}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}"
          # Only tag :latest for the highest minor version (3.14)
          if [[ "${{ matrix.minor }}" == "3.14" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ needs.detect.outputs.platforms }}
          provenance: false
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ matrix.minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ matrix.minor }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.minor }}

      - name: Post summary
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Python Base Image Build — ${{ matrix.minor }}

          | Key | Value |
          |-----|-------|
          | Python version | \`${{ matrix.version }}\` |
          | Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}\` |
          | Platforms | \`${{ needs.detect.outputs.platforms }}\` |
          | Digest | \`${{ steps.build.outputs.digest }}\` |
          | Trigger | \`${{ github.event_name }}\` |
          EOF

  build_push_amd64:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.push_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          build-args: |
            PYTHON_VERSION=${{ needs.detect.outputs.push_version }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ needs.detect.outputs.push_minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.detect.outputs.push_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ needs.detect.outputs.push_minor }}-amd64
          cache-to: type=gha,mode=max,scope=python-${{ needs.detect.outputs.push_minor }}-amd64

  build_push_arm64:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.push_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          build-args: |
            PYTHON_VERSION=${{ needs.detect.outputs.push_version }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ needs.detect.outputs.push_minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.detect.outputs.push_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ needs.detect.outputs.push_minor }}-arm64
          cache-to: type=gha,mode=max,scope=python-${{ needs.detect.outputs.push_minor }}-arm64

  merge_push_manifest:
    needs: [detect, build_push_amd64, build_push_arm64]
    if: github.event_name == 'push' && needs.detect.outputs.push_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          cmd=(
            docker buildx imagetools create
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.push_minor }}"
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.push_version }}"
          )

          if [[ "${{ needs.detect.outputs.push_minor }}" == "3.14" ]]; then
            cmd+=(--tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest")
          fi

          cmd+=(
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_push_amd64.outputs.digest }}"
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_push_arm64.outputs.digest }}"
          )

          "${cmd[@]}"

      - name: Post summary
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Python Base Image Build — ${{ needs.detect.outputs.push_minor }}

          | Key | Value |
          |-----|-------|
          | Python version | \`${{ needs.detect.outputs.push_version }}\` |
          | Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.push_version }}\` |
          | Platforms | \`linux/amd64, linux/arm64\` |
          | amd64 digest | \`${{ needs.build_push_amd64.outputs.digest }}\` |
          | arm64 digest | \`${{ needs.build_push_arm64.outputs.digest }}\` |
          | Trigger | \`${{ github.event_name }}\` |
          EOF
