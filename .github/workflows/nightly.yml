name: Scheduled Build

on:
  schedule:
    - cron: '0 4 * * 0'   # Weekly — Sunday 4 AM UTC
    - cron: '0 4 1 * *'   # Additional monthly run — 1st of month 4 AM UTC
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/python-base

permissions:
  contents: read
  packages: write

concurrency:
  group: scheduled-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect latest CPython versions and build matrix
        id: matrix
        run: |
          set -euo pipefail

          FTP_INDEX=$(curl -sL https://www.python.org/ftp/python/)
          PUSH_MINOR="3.14"

          build_matrix='{"include":['
          first=true

          for MINOR in 3.12 3.13 3.14; do
            if [[ "${{ github.event_name }}" == "push" && "$MINOR" != "$PUSH_MINOR" ]]; then
              echo "Push run prioritizes ${PUSH_MINOR}; skipping ${MINOR}"
              continue
            fi

            LATEST=$(echo "$FTP_INDEX" \
              | grep -oP "${MINOR//./\\.}\.\d+" \
              | sort -t. -k3 -n \
              | tail -1)

            if [[ -z "$LATEST" ]]; then
              echo "WARNING: No release found for ${MINOR}.x — skipping"
              continue
            fi

            # Check if already published (skip if so, unless manual/push)
            SKIP="false"
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              if MANIFEST_JSON=$(docker manifest inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${LATEST}" 2>/dev/null); then
                if echo "$MANIFEST_JSON" | jq -e '
                  any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
                  any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
                ' > /dev/null; then
                  echo "Version ${LATEST} already published for amd64 and arm64 — skipping"
                  SKIP="true"
                else
                  echo "Version ${LATEST} is missing one or more target platforms — rebuilding"
                fi
              fi
            fi

            if [[ "$SKIP" == "false" ]]; then
              [[ "$first" == "true" ]] && first=false || build_matrix+=','
              build_matrix+="{\"minor\":\"${MINOR}\",\"version\":\"${LATEST}\"}"
            fi
          done

          build_matrix+=']}'

          # Check if matrix is empty
          COUNT=$(echo "$build_matrix" | jq '.include | length')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No versions to build"
            echo "matrix=" >> "$GITHUB_OUTPUT"
            echo "build_matrix=" >> "$GITHUB_OUTPUT"
          else
            # One build job per (minor, arch), each on a native runner (no QEMU).
            per_arch=$(echo "$build_matrix" | jq -c '
              {include: [.include[] | . as $v | ("amd64", "arm64") as $a
                | $v + {arch: $a, runner: (if $a == "arm64" then "ubuntu-24.04-arm" else "ubuntu-latest" end)}]}')
            echo "matrix=${build_matrix}" >> "$GITHUB_OUTPUT"
            echo "build_matrix=${per_arch}" >> "$GITHUB_OUTPUT"
            echo "Building: ${per_arch}"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          build-args: |
            PYTHON_VERSION=${{ matrix.version }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ matrix.minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=python-${{ matrix.minor }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.minor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [detect, build]
    # Run per minor even if another minor's build failed; the digest count check below
    # keeps a minor with a missing platform from being published single-arch.
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.minor }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Exactly one digest per platform (amd64 + arm64), or publish nothing.
          if [[ "$(ls | wc -l)" -ne 2 ]]; then
            echo "::error::Expected 2 digests (amd64, arm64) for ${{ matrix.minor }}, found: $(ls | tr '\n' ' ')"
            exit 1
          fi

          cmd=(
            docker buildx imagetools create
            --tag "${IMAGE}:${{ matrix.minor }}"
            --tag "${IMAGE}:${{ matrix.version }}"
          )

          # Only tag :latest for the highest minor version (3.14)
          if [[ "${{ matrix.minor }}" == "3.14" ]]; then
            cmd+=(--tag "${IMAGE}:latest")
          fi

          for digest in *; do
            cmd+=("${IMAGE}@sha256:${digest}")
          done

          "${cmd[@]}"

      - name: Post summary
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Python Base Image Build — ${{ matrix.minor }}

          | Key | Value |
          |-----|-------|
          | Python version | \`${{ matrix.version }}\` |
          | Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}\` |
          | Platforms | \`linux/amd64, linux/arm64\` |
          | Trigger | \`${{ github.event_name }}\` |
          EOF
