name: Release Build

on:
  push:
    tags:
      - 'v3.12.*'
      - 'v3.13.*'
      - 'v3.14.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/python-base

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MINOR="${VERSION%.*}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "Building Python ${VERSION} (minor: ${MINOR})"

  build_amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          build-args: |
            PYTHON_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ needs.prepare.outputs.minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ needs.prepare.outputs.minor }}-amd64
          cache-to: type=gha,mode=max,scope=python-${{ needs.prepare.outputs.minor }}-amd64

  build_arm64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          build-args: |
            PYTHON_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=python-base
            org.opencontainers.image.description=PGO+LTO optimized CPython ${{ needs.prepare.outputs.minor }} on Debian Bookworm
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=python-${{ needs.prepare.outputs.minor }}-arm64
          cache-to: type=gha,mode=max,scope=python-${{ needs.prepare.outputs.minor }}-arm64

  merge:
    needs: [prepare, build_amd64, build_arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          cmd=(
            docker buildx imagetools create
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.minor }}"
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
          )

          if [[ "${{ needs.prepare.outputs.minor }}" == "3.14" ]]; then
            cmd+=(--tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest")
          fi

          cmd+=(
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_amd64.outputs.digest }}"
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build_arm64.outputs.digest }}"
          )

          "${cmd[@]}"

      - name: Post summary
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Python Base Image Release

          | Key | Value |
          |-----|-------|
          | Python version | \`${{ needs.prepare.outputs.version }}\` |
          | Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}\` |
          | Platforms | \`linux/amd64, linux/arm64\` |
          | amd64 digest | \`${{ needs.build_amd64.outputs.digest }}\` |
          | arm64 digest | \`${{ needs.build_arm64.outputs.digest }}\` |
          | Tag | \`${{ github.ref_name }}\` |
          EOF
